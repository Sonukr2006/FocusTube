services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/ngnix.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - web_network
      - focustube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./server/.env
    networks:
      - focustube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/healthz || exit 1"]
      interval: 10s       # Har 10 second me check karega
      timeout: 5s         # 5 second tak response nahi aya toh fail manega
      retries: 5          # 5 bar fail hone par container ko 'unhealthy' mark karega
      start_period: 15s   # Container start hone ke 15 sec baad check karna shuru karega (kyunki Node.js thoda time leta hai)

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - web_network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  web_network:
    driver: bridge
  focustube-network:
    driver: bridge

